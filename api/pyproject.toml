[project]
name = "profilo-api"
version = "0.1.0"
description = "Profilo backend API"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.30",
    "alembic>=1.17",
    "celery[redis]>=5.5",
    "redis>=6.4",
    "structlog>=25.4",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.3",
    "email-validator>=2.3",
    "zxcvbn>=4.5",
    "jinja2>=3.1",
    "phonenumbers>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "httpx>=0.28",
    "ruff>=0.14",
    "mypy>=1.18",
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    "pip-audit>=2.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assertions and fixture passwords in tests

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "zxcvbn", "zxcvbn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
