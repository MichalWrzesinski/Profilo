# Staging and production stack (one server per environment, ADR 0004).
# Started by deploy.sh from $APP_DIR/releases/<sha>/ with IMAGE_TAG=<sha> and the
# variables of $APP_DIR/.env exported (bootstrap.sh; server-only, never committed).
# Only the application containers read the whole .env; Caddy and PostgreSQL get the
# few variables they need (least privilege).
name: profilo

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "14" }

x-api: &api
  image: ghcr.io/michalwrzesinski/profilo-api:${IMAGE_TAG:?IMAGE_TAG is required}
  env_file:
    - ${APP_DIR:?APP_DIR is required}/.env
    # Runtime secrets written by the deploy workflow (SMTP).
    - path: ${APP_DIR:?APP_DIR is required}/.env.secrets
      required: false
    # SENTRY_DSN (TASK-023), written by the deploy workflow; without it reporting is off.
    - path: ${APP_DIR:?APP_DIR is required}/.env.monitoring
      required: false
  environment:
    # Trust X-Forwarded-* only from Caddy (fixed address below; AGENTS.md pitfalls). Behind
    # the host's nginx also from the Docker gateway it connects through (proxied mode).
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
    SENTRY_RELEASE: ${IMAGE_TAG}
  restart: unless-stopped
  logging: *logging
  networks: [internal]
  volumes:
    - media:/data/media
  depends_on:
    db: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?}
      TLS_MODE: ${TLS_MODE:-acme}
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32}
      ROBOTS_TAG: ${ROBOTS_TAG:?}
      ACME_EMAIL: ${ACME_EMAIL:-unused@example.invalid}
    volumes:
      # A fixed directory (deploy.sh copies the release's Caddyfile there), so the container
      # is not recreated by a new release; the whole directory, so a replaced file (new
      # inode) is still seen on reload.
      - ${APP_DIR:?APP_DIR is required}/caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
    networks:
      internal:
        ipv4_address: ${CADDY_IP:-172.28.0.10}

  # Blue-green (deploy.sh): the release being deployed starts in the idle colour beside the
  # live one; Caddy switches to it (caddy/upstreams.caddy) after it is ready. Profiles keep
  # a plain `up` from starting both.
  api-blue: &api_service
    <<: *api
    profiles: [blue]
    # Image decoding is bounded (24 Mpx, two at a time); this caps anything unforeseen.
    mem_limit: 1536m

  api-green:
    <<: *api_service
    profiles: [green]

  worker:
    <<: *api
    command: ["celery", "-A", "app.worker", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  beat:
    <<: *api
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/celerybeat-schedule') else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: [tools]
    healthcheck:
      disable: true

  client-blue: &client
    image: ghcr.io/michalwrzesinski/profilo-client:${IMAGE_TAG:?IMAGE_TAG is required}
    profiles: [blue]
    restart: unless-stopped
    # Only SENTRY_DSN (not the application's other secrets).
    env_file:
      - path: ${APP_DIR:?APP_DIR is required}/.env.monitoring
        required: false
    environment: &client_env
      # The API of the same colour (same release).
      API_INTERNAL_URL: http://api-blue:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      # Operator address for abuse reports (PUB-BR-10); empty shows the placeholder.
      ABUSE_EMAIL: ${ABUSE_EMAIL:-}
      SENTRY_RELEASE: ${IMAGE_TAG}
      SENTRY_ENVIRONMENT: ${ENVIRONMENT:-production}
    logging: *logging
    networks: [internal]

  client-green:
    <<: *client
    profiles: [green]
    environment:
      <<: *client_env
      API_INTERNAL_URL: http://api-green:8000

  # Production only (profile; deploy.sh starts it when $APP_DIR/backup/config exists): daily
  # encrypted off-site backups of the database and media, monthly restore test, alert
  # e-mails (infra/backup, TASK-022). Gets only what it needs: database login, SMTP, its own
  # settings and keys.
  backup:
    image: ghcr.io/michalwrzesinski/profilo-backup:${IMAGE_TAG:?IMAGE_TAG is required}
    profiles: [backup]
    restart: unless-stopped
    # tini as PID 1 forwards SIGTERM to the scheduler, which stops a running job cleanly
    # (restic removes its repository lock) within the grace period.
    init: true
    stop_grace_period: 30s
    env_file:
      - path: ${APP_DIR:?APP_DIR is required}/.env.secrets
        required: false
      - path: ${APP_DIR:?APP_DIR is required}/backup/config
        required: false
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:?}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: ${POSTGRES_DB:?}
      # Fixed: retention groups snapshots by host and tag, a changed name would never be pruned.
      BACKUP_HOST: profilo
    volumes:
      - media:/data/media:ro
      - backup_state:/state
      - ${APP_DIR:?APP_DIR is required}/backup/keys:/run/backup:ro
    logging: *logging
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql
    logging: *logging
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - valkeydata:/data
    logging: *logging
    networks: [internal]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  internal:
    ipam:
      config:
        # Configurable on a shared host where other projects use Docker networks too.
        - subnet: ${INTERNAL_SUBNET:-172.28.0.0/24}

volumes:
  media:
  pgdata:
  valkeydata:
  caddy_data:
  caddy_config:
  backup_state:
