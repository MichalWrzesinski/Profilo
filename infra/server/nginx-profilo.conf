# Profilo behind the host's nginx (shared host, TLS_MODE=proxied). Copy to
# /etc/nginx/sites-available/Profilo, replace DOMAIN and PORT if they differ, then:
#   sudo nginx -t && sudo systemctl reload nginx
# The certificate is the one certbot already manages for the domain. Security headers
# (HSTS, CSP, …) come from Profilo's own Caddy and pass through unchanged.

server {
    listen 80;
    listen [::]:80;
    server_name profilo.gitpush.app;

    # certbot renews over HTTP; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name profilo.gitpush.app;

    ssl_certificate /etc/letsencrypt/live/profilo.gitpush.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profilo.gitpush.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Image uploads: 10 MB plus multipart overhead (Caddy enforces the exact limits).
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The visitor's address, replaced (not appended): nginx is the edge, so nothing a
        # client sends in X-Forwarded-For is believed (rate limits per IP).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}
