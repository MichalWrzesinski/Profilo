name: profilo

x-api: &api
  build:
    context: ./api
    target: dev
  image: profilo-api:dev
  env_file: .env
  volumes:
    - ./api:/app
  depends_on:
    db: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *api

  worker:
    <<: *api
    command: ["celery", "-A", "app.worker", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  beat:
    <<: *api
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/celerybeat-schedule') else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    image: profilo-client:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./client:/repo/client
      - client_node_modules:/repo/client/node_modules
      - client_next:/repo/client/.next
      - ./docs/design/tokens.css:/repo/docs/design/tokens.css:ro

  db:
    image: postgres:18.6-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  client_node_modules:
  client_next:
