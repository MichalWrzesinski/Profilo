name: profilo

x-api: &api
  build:
    context: ./api
    target: dev
  image: profilo-api:dev
  env_file:
    - path: .env
      required: false
  volumes:
    - ./api:/app
    - ./docs/api/openapi.yaml:/contract/openapi.yaml:ro
  depends_on:
    db: { condition: service_healthy }
    valkey: { condition: service_healthy }

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./infra/caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      client: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *api

  worker:
    <<: *api
    command: ["celery", "-A", "app.worker", "worker", "--loglevel", "INFO", "--concurrency", "2"]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 15s
      start_period: 20s
      retries: 3

  beat:
    <<: *api
    command: ["celery", "-A", "app.worker", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/celerybeat-schedule') else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    image: profilo-client:dev
    environment:
      API_INTERNAL_URL: http://api:8000
    volumes:
      - ./client:/repo/client
      - client_node_modules:/repo/client/node_modules
      - client_next:/repo/client/.next
      - ./docs/design/tokens.css:/repo/docs/design/tokens.css:ro

  db:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    env_file:
    - path: .env
      required: false
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27.11@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Tool, not a service: `docker compose run --rm gitleaks …` (Makefile `secrets`, pre-commit hook).
  gitleaks:
    image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    profiles: [tools]
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /repo

volumes:
  pgdata:
  client_node_modules:
  client_next:
