name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs: one run per branch (newer push cancels older). main: one group per commit, so
  # every merged commit gets its own check and published images.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check (AGENTS.md): lint, types, tests with coverage, API contract,
  # dependency audit, gitleaks, production image build — `make check audit secrets` plus
  # the same production builds as `make images`, with a layer cache.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Dev images used by `make check` (Compose reuses the loaded tags), cached in GHA.
      - name: Build api dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          target: dev
          load: true
          tags: profilo-api:dev
          cache-from: type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev

      - name: Build client dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: client/Dockerfile
          target: dev
          load: true
          tags: profilo-client:dev
          cache-from: type=gha,scope=client-dev
          cache-to: type=gha,mode=max,scope=client-dev

      - name: Lint, type checks, tests, contract
        run: |
          cp .env.example .env
          make check

      - name: Dependency audit
        run: make audit

      - name: Secret scan (gitleaks)
        run: make secrets

      - name: Build api production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          target: prod
          push: false
          cache-from: type=gha,scope=profilo-api
          cache-to: type=gha,mode=max,scope=profilo-api

      - name: Build client production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: client/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=profilo-client
          cache-to: type=gha,mode=max,scope=profilo-client

      - name: Stop containers
        if: always()
        run: docker compose down -v

  # Main flow end to end (Playwright) against the local Compose stack. Not a required
  # check yet: it depends on the dev server and Mailpit; failures upload the report.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build api dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: api
          target: dev
          load: true
          tags: profilo-api:dev
          cache-from: type=gha,scope=api-dev

      - name: Build client dev image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: client/Dockerfile
          target: dev
          load: true
          tags: profilo-client:dev
          cache-from: type=gha,scope=client-dev

      - name: Main flow
        env:
          CI: 'true'
        run: |
          cp .env.example .env
          make e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/report
            e2e/test-results
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down -v

  publish:
    name: publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: profilo-api
            context: api
            file: api/Dockerfile
          - image: profilo-client
            context: .
            file: client/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          push: true
          tags: ghcr.io/michalwrzesinski/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
