name: Deploy staging

# Runs after CI succeeds on main (images are published by the CI `publish` job),
# or manually for a given commit. Secrets: STAGING_SSH_HOST, STAGING_SSH_KEY,
# STAGING_SSH_KNOWN_HOSTS, STAGING_SMTP_USERNAME, STAGING_SMTP_PASSWORD; variables:
# STAGING_DOMAIN, STAGING_MAIL_FROM, optional STAGING_SSH_USER, STAGING_APP_DIR,
# STAGING_SMTP_HOST, STAGING_SMTP_PORT, STAGING_SMTP_SECURITY (docs/runbook.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main to deploy (also used to roll back to an older release)
        required: true

# Job-level permissions: the job that reaches the server gets a read-only token (it is
# handed to the server for the registry login); only the status job may write.
permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy staging
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ vars.STAGING_SSH_USER || 'deploy' }}
      APP_DIR: ${{ vars.STAGING_APP_DIR || '/srv/profilo' }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid commit SHA"; exit 1; }
          [[ -n "$DOMAIN" && -n "$SSH_HOST" ]] || { echo "::error::STAGING_DOMAIN or STAGING_SSH_HOST missing (docs/runbook.md)"; exit 1; }
          [[ "$SSH_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo "::error::invalid STAGING_SSH_USER"; exit 1; }
          [[ "$APP_DIR" =~ ^/srv/[A-Za-z0-9._-]+$ ]] || { echo "::error::STAGING_APP_DIR must be a directory directly in /srv"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # Only commits on main are deployed (deployment standard). After CI on main, a commit
      # that is no longer the head of main is skipped: the newer commit's run deploys it.
      - name: Check the commit is on main
        id: guard
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
          if [[ "$EVENT" == workflow_run && "$(git rev-parse origin/main)" != "$SHA" ]]; then
            echo "::notice::main has moved on; skipping $SHA"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # The runner script comes from main; the stack files from the deployed commit.
          cp infra/ci/deploy-remote.sh "$RUNNER_TEMP/"
          git checkout --quiet "$SHA"

      - name: Deploy, migrate, verify (rollback on failure), external smoke tests
        if: steps.guard.outputs.skip != 'true'
        env:
          MODE: deploy
          ENV_NAME: staging
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
          SMTP_USERNAME: ${{ secrets.STAGING_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.STAGING_SMTP_PASSWORD }}
          MAIL_FROM: ${{ vars.STAGING_MAIL_FROM }}
          # Any SMTP server: Brevo by default, or e.g. the operator's own mailbox.
          SMTP_HOST: ${{ vars.STAGING_SMTP_HOST || 'smtp-relay.brevo.com' }}
          SMTP_PORT: ${{ vars.STAGING_SMTP_PORT || '587' }}
          SMTP_SECURITY: ${{ vars.STAGING_SMTP_SECURITY || 'starttls' }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          # Error reporting (TASK-023).
          MONITORING_REQUIRED: 'false'
          SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
        run: bash "$RUNNER_TEMP/deploy-remote.sh"

  verified:
    name: mark verified on staging
    needs: deploy
    if: needs.deploy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # deploy-production accepts only commits that staging verified (deployment standard).
      - name: Set the commit status deploy/staging
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context=deploy/staging \
            -f description="Deployed and verified on staging" -f target_url="$RUN_URL" >/dev/null

  sentry:
    name: Sentry release
    needs: deploy
    if: needs.deploy.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Its own job: the Sentry token never reaches the server; the registry token only reads.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Release, source maps, deployment
        env:
          SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          ENV_NAME: staging
          SENTRY_REQUIRED: 'false'
          SENTRY_AUTH_TOKEN: ${{ secrets.STAGING_SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: bash infra/ci/sentry-release.sh
