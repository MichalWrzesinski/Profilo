version: 2
updates:
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor-patch: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /client
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 10
    groups:
      # Packages that must move together (peer dependencies).
      vitest: { patterns: [vitest, "@vitest/*"] }
      npm-minor-patch: { update-types: [minor, patch] }
    ignore:
      # eslint-plugin-import (via eslint-config-next) supports ESLint <= 9; revisit when it adds 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/api, /client]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directories: [/, /infra/server]
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
